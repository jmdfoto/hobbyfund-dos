# HobbyFund moved to Cloudflare (hobbyfund.app). Every request to the old Netlify site is
# permanently redirected there; the ledger was migrated with Export CSV / Import CSV.
[build]
  command = "npm run build"
  publish = "dist/client"

[[redirects]]
  from = "/*"
  to = "https://hobbyfund.app/:splat"
  status = 301
  force = true
